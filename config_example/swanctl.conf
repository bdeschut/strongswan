# /opt/strongswan/swanctl.conf
connections {
    paloalto-hub {
        version = 2
	proposals = aes256gcm16-prfsha384-ecp384-ke1_mlkem768

        # Endpoints
        local_addrs = %defaultroute
        remote_addrs = changeme_hub.tld
	local_port = 4500	# forces strongSwan to use the 4500 NAT-T socket
	remote_port = 4500	# forces strongSwan to use the 4500 NAT-T socket
	mobike = no		# prevents strongSwan from corrupting an in-flight CONNECTING handshake when wlan0 flaps in the garden

        # Never give up trying to negotiate or reconnect if Wi-Fi/WAN blips
        keyingtries = 0

        # Identifications
        local {
            auth = psk
            id = changeme_spoke.tld
        }
        remote {
            auth = psk
            id = changeme_hub.tld
        }

        children {
            paloalto-tunnel {
		esp_proposals = aes256gcm16-ecp384-ke1_mlkem768

                # Bind to XFRM interface ID 42
                if_id_in = 42
                if_id_out = 42

                # Traffic Selectors (See Note Below)
                local_ts = 0.0.0.0/0
                remote_ts = 0.0.0.0/0

                # IPsec Lifetime: 1 hour (3600s), rekeying slightly before expiry
                rekey_time = 3000s # When StrongSwan attempts to negotiate a replacement IPsec SA before the 1-hour expiration
                life_time = 3600s # IPSec Crypto Profiles > Key Lifetime. Hard lifetime of Phase 2 (Data Tunnel / Child SA).
                rand_time = 300s

                start_action = trap|start
                close_action = start
                dpd_action = restart
            }
        }

        # --- RFC 8784 Post-Quantum PSK (PPK) ---
        ppk_id = changeme_pq-id-spoke-hub
        ppk_required = yes

        # --- IKE Lifetime & Resiliency (8 hours) ---
        reauth_time = 0 # Disables re-authentication so rekeying happens seamlessly in the background without dropping the tunnel
        rekey_time = 25200s # Target rekey at 7 hours
        over_time = 3600s # Hard expire 1h after rekey_time (25200s + 3600s = 28800s / 8h)
        rand_time = 1800s   # Randomize rekey window up to 30m earlier
        dpd_delay = 20s # IKE Gateways > Advanced Options > Dead Peer Detection: Interval (default 5
    }
}

secrets {
    # 1. Classical IKEv2 Pre-Shared Key
    ike-classical {
        id-local = changeme_spoke.tld
        id-remote = changeme_hub.tld
        secret = "changeme_secret"
    }

    # 2. Post-Quantum Pre-Shared Key (PPK)
    ppk-putte {
        id = changeme_pq-id-spoke-hub
        secret = "changeme_secret"
    }
}
